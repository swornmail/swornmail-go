# Test records. Anything else under these domains is NXDOMAIN.
no-resolv
no-hosts
listen-address=127.0.0.1
bind-interfaces
log-queries
log-facility=/tmp/dnsmasq.log
local=/ip6.arpa/
local=/in-addr.arpa/
local=/example.com/
local=/test.example/
# Reverse-tree pointer for 2001:db8:f00:1234::/64, and the operator's policy.
txt-record=_sworn.4.3.2.1.0.0.f.0.8.b.d.0.1.0.0.2.ip6.arpa,"v=SWORN1; d=mailer.example.com"
txt-record=_prefixes._sworn.mailer.example.com,"v=SWORN1; p=2001:db8:f00::/48; u=64"
# The reverse-tree pointer lookup for 2001:db8:f00:dead::/64 goes to
# servfail.py and comes back SERVFAIL: the milter must report temperror,
# never none. Only that name, so no later lookup can produce the temperror.
server=/_sworn.d.a.e.d.0.0.f.0.8.b.d.0.1.0.0.2.ip6.arpa/127.0.0.1#5353
